kind = "web"
previewPath = "/"
title = "AtWassup — AI WhatsApp Automation"
description = "A polished one-page marketing website for AtWassup, an AI-native WhatsApp Business automation platform for Indian SMBs, D2C brands, and service businesses."
version = "1.0.0"
id = "artifacts/wassup"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25720

[services.development]
run = "pnpm --filter @workspace/wassup run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wassup", "run", "build" ]
serve = "static"
publicDir = "artifacts/wassup/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25720"
BASE_PATH = "/"
